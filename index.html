<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Interactive Brand Filter</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-face-aframe.prod.js"></script>
  <style> src"https://www.instagram.com/leoncydaniel/"
    body{margin:0;overflow:hidden;font-family:Arial,sans-serif;}
    /* CTA Button overlay */
    #cta{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
      padding:14px 32px;border-radius:30px;font-size:16px;font-weight:700;
      color:#fff;border:none;cursor:pointer;z-index:999;
      transition:all .3s;box-shadow:0 4px 20px rgba(0,0,0,.4);}
    #theme-hint{position:fixed;top:18px;left:50%;transform:translateX(-50%);
      background:rgba(0,0,0,.65);color:#fff;padding:8px 18px;border-radius:20px;
      font-size:13px;z-index:999;}
  </style>
</head>
<body>

<div id="theme-hint">👆 Tap anywhere to change theme</div>
<button id="cta" onclick="window.open('https://www.instagram.com/leoncydaniel/','_blank')">
  Explore Courses →
</button>

<a-scene
  mindar-face
  color-space="sRGB"
  renderer="colorManagement:true"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false">

  <a-camera active="false" position="0 0 0"></a-camera>

  <!-- Forehead: brand name text -->
  <a-entity mindar-face-target="anchorIndex:1">
    <a-text id="brand-text"
      value="✦ Leoncy Daniel ✦"
      position="0 0.18 0"
      scale="0.4 0.4 0.4"
      color="#FF6B35"
      align="center"
      animation__float="property:position;from:0 0.18 0;to:0 0.22 0;dir:alternate;loop:true;dur:1500">
    </a-text>
    <a-torus id="brand-ring"
      position="0 0.02 0"
      radius="0.22" radius-tubular="0.01"
      color="#FF6B35"
      animation="property:rotation;to:0 360 0;loop:true;dur:3000;easing:linear">
    </a-torus>
  </a-entity>

  <!-- Left cheek: logo sphere -->
  <a-entity mindar-face-target="anchorIndex:234">
    <a-sphere id="logo-sphere"
      position="0 0 0.04"
      radius="0.04"
      color="#FF6B35"
      animation="property:scale;from:1 1 1;to:1.3 1.3 1.3;dir:alternate;loop:true;dur:800">
    </a-sphere>
  </a-entity>

  <!-- Right cheek: logo sphere mirror -->
  <a-entity mindar-face-target="anchorIndex:454">
    <a-sphere id="logo-sphere-r"
      position="0 0 0.04"
      radius="0.04"
      color="#FF6B35"
      animation="property:scale;from:1 1 1;to:1.3 1.3 1.3;dir:alternate;loop:true;dur:800;delay:400">
    </a-sphere>
  </a-entity>

</a-scene>

<script>
// ── BRAND THEMES — customise these! ──────────────────────────
const THEMES = [
  { name:"Orange Energy",  primary:"#FF6B35", cta:"#FF6B35",  ctaText:"Explore Courses →" },
  { name:"Teal Trust",     primary:"#00C9A7", cta:"#00C9A7",  ctaText:"Book a Session →" },
  { name:"Violet Vision", primary:"#A855F7", cta:"#A855F7",  ctaText:"See Projects →"  },
  { name:"Amber Warm",    primary:"#F59E0B", cta:"#F59E0B",  ctaText:"Learn More →"    },
];

let themeIndex = 0;

function applyTheme(t) {
  const el = (id) => document.getElementById(id);
  el('brand-text').setAttribute('color', t.primary);
  el('brand-ring').setAttribute('color', t.primary);
  el('logo-sphere').setAttribute('color', t.primary);
  el('logo-sphere-r').setAttribute('color', t.primary);
  el('cta').style.background = t.cta;
  el('cta').textContent = t.ctaText;
  el('theme-hint').textContent = `✦ Theme: ${t.name} — tap to switch`;
}

// Tap anywhere to cycle themes
document.addEventListener('click', () => {
  themeIndex = (themeIndex + 1) % THEMES.length;
  applyTheme(THEMES[themeIndex]);
});

applyTheme(THEMES[0]); // Apply initial theme
</script>
</body>
</html>
